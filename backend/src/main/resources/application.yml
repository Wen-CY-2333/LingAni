server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lingani-backend
  # 从 backend/.env 加载数据库密码、JWT 密钥、CycAni Token 等敏感配置
  config:
    import: optional:file:./.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/lingani?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lingani:
  jwt:
    secret: "${JWT_SECRET:lingani-local-dev-secret-change-me-0123456789abcdef}"
    expire-seconds: ${JWT_EXPIRE_SECONDS:604800}
    issuer: ${JWT_ISSUER:lingani}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}"
  cycani:
    token: "${CYCANI_TOKEN:}"

logging:
  level:
    "[com.lingani]": info

server:
  port: 8080

spring:
  application:
    name: lingani-backend
  # 从 backend/.env 加载数据库密码、JWT 密钥、CycAni Token 等敏感配置
  config:
    import: optional:file:./.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${DB_URL:jdbc:mysql://localhost:3306/lingani?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lingani:
  jwt:
    # 用户登录令牌（USER JWT）：长期身份凭据，登录后签发，用于访问全部受保护业务接口
    user:
      secret: "${USER_JWT_SECRET:lingani-local-dev-secret-change-me-0123456789abcdef}"
      issuer: lingani
      ttl-seconds: 604800
    # Agent 委托令牌（AGENT JWT）：短期委托凭据，仅供单次 AI 对话链路使用，默认 5 分钟失效
    # 密钥必须与 Python Agent 服务侧的 AGENT_JWT_SECRET 完全一致
    agent:
      secret: "${AGENT_JWT_SECRET:}"
      # 以下固定值必须与 Python Agent 侧的 AGENT_JWT_ISSUER / AGENT_JWT_AUDIENCE 保持一致
      issuer: lingani-backend
      audience: lingani-agent
      ttl-seconds: 300
  cors:
    allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"
  cycani:
    token: "${CYCANI_TOKEN:}"

logging:
  level:
    "[com.lingani]": info
